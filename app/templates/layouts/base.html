<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title | default("Antarctic Digital Twin") }}{% endblock %}</title>
    <!-- Google Fonts: Inter (UI), Playfair Display (headings), Playfair (body), JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Playfair:ital,opsz,wght@0,5..1200,300;0,5..1200,400;0,5..1200,500;0,5..1200,600;0,5..1200,700;1,5..1200,300;1,5..1200,400;1,5..1200,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- DTFIAS Design Tokens -->
    <style>
        :root {
            /* Brand palette */
            --brand-deep-green: #1A312C;
            --brand-teal: #428475;
            --brand-mint: #C8E6D7;
            --brand-cream: #F5F2EB;
            --brand-cream-dark: #E8E3D9;
            /* Status colours — light bg context */
            --status-ok: #2E7D5B;
            --status-info: #2878A8;
            --status-warning: #D9822B;
            --status-critical: #C44536;
            /* Status bg tints */
            --status-ok-bg: #E8F4EE;
            --status-info-bg: #E8F2F8;
            --status-warning-bg: #FFF3E3;
            --status-critical-bg: #FBE9E7;
            /* Typography */
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-heading: 'Playfair Display', Georgia, 'Times New Roman', serif;
            --font-body: 'Playfair', Georgia, 'Times New Roman', serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        body {
            font-family: var(--font-ui);
        }
    </style>
    <!-- In a real app, serve these from /static/vendor/ -->
    <script src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="{{ url_for('static', path='css/app.css') }}" rel="stylesheet">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "deep-green": "#1A312C", "deep-green-darker": "#10221E", "deep-green-surface": "#152924", "deep-green-border": "#25453E", "teal-brand": "#428475", "teal-brand-hover": "#356d61", "teal-brand-active": "#2c5c52", "mint-light": "#E8F3EF", "mint-border": "#C5E0D5", "warm-white": "#F7F4ED", "warm-card": "#FFFFFF", "warm-border": "#E4DFD3", "warm-border-strong": "#CCC5B7", "warm-text-primary": "#1E2522", "warm-text-muted": "#5D6661", "status-normal": "#2E7D5B", "status-info": "#2878A8", "status-warning": "#D9822B", "status-critical": "#C44536", "tertiary-fixed-dim": "#b1cdbd", "surface-container-highest": "#273834", "primary-fixed-dim": "#b2ccc4", "secondary-fixed-dim": "#91d3c2", "on-surface-variant": "#c2c8c5", "on-surface": "#d3e7e0", "on-secondary-fixed-variant": "#005144", "telemetry-critical-bg": "#FBE9E7", "surface-variant": "#273834", "on-secondary-fixed": "#00201a", "error-container": "#93000a", "surface-tint": "#b2ccc4", "background": "#051613", "telemetry-warning-bg": "#FFF3E3", "tertiary": "#b1cdbd", "on-primary-container": "#819993", "error": "#ffb4ab", "inverse-surface": "#d3e7e0", "on-error": "#690005", "on-tertiary-fixed-variant": "#334c40", "surface-cream": "#F4F3ED", "secondary-container": "#015346", "outline-variant": "#424846", "surface-container-high": "#1c2d29", "surface": "#051613", "telemetry-safe": "#2E7D5B", "on-tertiary-fixed": "#072016", "primary": "#b2ccc4", "secondary-fixed": "#acf0de", "surface-dim": "#051613", "on-background": "#d3e7e0", "surface-bright": "#2b3d38", "on-secondary": "#00382e", "telemetry-warning": "#D9822B", "surface-cream-light": "#F8F7F2", "tertiary-container": "#1a3227", "surface-container": "#12231f", "primary-fixed": "#cee8e0", "inverse-primary": "#4b635d", "telemetry-critical": "#C44536", "on-error-container": "#ffdad6", "on-primary-fixed": "#071f1b", "tertiary-fixed": "#cde9d9", "secondary": "#91d3c2", "surface-container-low": "#0d1f1b", "on-primary": "#1e3530", "surface-container-lowest": "#02110d", "surface-panel": "#223F39", "on-tertiary-container": "#809b8c", "inverse-on-surface": "#23342f", "on-tertiary": "#1d352a", "telemetry-safe-bg": "#E8F4EE", "on-primary-fixed-variant": "#344b46", "on-secondary-container": "#83c5b4", "telemetry-info": "#2878A8", "primary-container": "#1a312c", "outline": "#8c928f", "telemetry-info-bg": "#E8F2F8" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "space-sm": "0.5rem", "space-2xl": "3rem", "space-2xs": "0.125rem", "panel-gutter": "0.75rem", "canvas-margin": "1.5rem", "space-xl": "2rem", "space-lg": "1.5rem", "space-base": "1rem", "space-md": "0.75rem", "space-xs": "0.25rem" }, fontFamily: { "headline-lg": ["Inter"], "body-sm": ["Inter"], "headline-xl": ["Inter"], "headline-md": ["Inter"], "label-xs": ["Inter"], "title-sm": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "display-lg": ["Inter"], "headline-xl-mobile": ["Inter"], "telemetry-code": ["JetBrains Mono", "monospace"] }, fontSize: { "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-xs": ["10px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" }], "title-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg": ["44px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-xl-mobile": ["26px", { "lineHeight": "34px", "letterSpacing     </script>
    {% block head %}{% endblock %}
</head>

<body class="antialiased" style="background-color: var(--brand-cream); color: #1A312C; font-family: var(--font-ui);"
    hx-boost="true">
    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>

</html>
