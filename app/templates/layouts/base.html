        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Playfair:ital,opsz,wght@0,5..1200,300;0,5..1200,400;0,5..1200,500;0,5..1200,600;0,5..1200,700;1,5..1200,300;1,5..1200,400;1,5..1200,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"

    <!-- DTFIAS Design Tokens -->
    <style>
        :root {
            /* Brand palette */
            --brand-deep-green: #1A312C;
            --brand-teal: #428475;
            --brand-mint: #C8E6D7;
            --brand-cream: #F5F2EB;
            --brand-cream-dark: #E8E3D9;
            /* Status colours — light bg context */
            --status-ok: #2E7D5B;
            --status-info: #2878A8;
            --status-warning: #D9822B;
            --status-critical: #C44536;
            --status-stale: #6B7280;
            --status-offline: #9B1C1C;
            /* Status bg tints */
            --status-ok-bg: #E8F4EE;
            --status-info-bg: #E8F2F8;
            --status-warning-bg: #FFF3E3;
            --status-critical-bg: #FBE9E7;
            --status-stale-bg: #F3F4F6;
            /* Status colours — dark bg context */
            --status-ok-dark: #4ABA83;
            --status-info-dark: #5BA3D4;
            --status-warning-dark: #F0A050;
            --status-critical-dark: #E06050;
            /* Typography */
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-heading: 'Playfair Display', Georgia, 'Times New Roman', serif;
            --font-body: 'Playfair', Georgia, 'Times New Roman', serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        body {
            font-family: var(--font-ui);
        }

        /* Subtle core animations for interactive elements */
        a,
        button,
        input,
        select,
        textarea,
        .card,
        .hotspot {
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out, background-color 0.25s ease-in-out, border-color 0.25s ease-in-out;
        }

        /* Glassmorphism utilities */

        .glass-panel {
            background: rgba(145, 211, 194, 0.08);
            border: 1px solid rgba(145, 211, 194, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .glass-panel:hover {
            background: rgba(145, 211, 194, 0.2);
            border-color: rgba(145, 211, 194, 0.4);
        }

        .glass-panel:active {
            transform: scale(0.97);
        }

        /* Animation keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* P0 Critical CSS Pulse Animation */
        @keyframes pulse-p0 {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.72;
            }
        }

        .status-p0-pulse,
        .animate-p0 {
            animation: pulse-p0 1.6s ease-in-out infinite;
            transform-origin: center;
        }

        /* Technical Differentiator: Sensor Staleness Dimming */
        .is-stale {
            opacity: 0.45 !important;
            filter: grayscale(70%);
            transition: opacity 0.3s ease;
        }
    </style>

<body class="antialiased" style="background-color: var(--brand-cream); color: #1A312C; font-family: var(--font-ui);"
    hx-boost="true"
    hx-target="#main-content"
    hx-select="#main-content"
    hx-swap="innerHTML"
    hx-push-url="true">
    {% block body %}
        <main id="main-content">
            {% block content %}{% endblock %}
        </main>
    {% endblock %}

    {% block scripts %}{% endblock %}

    <!-- HTMX & Alpine.js SPA Navigation Integration (Phase 3.5) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // HTMX CSRF Auto-Injection for mutating methods (C11)
            const handleConfigRequest = (evt) => {
                const token = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
                if (token) {
                    if (evt.detail && evt.detail.headers && evt.detail.verb && evt.detail.verb !== 'get') {
                        evt.detail.headers['X-CSRF-Token'] = token;
                    }
                    if (evt.detail && evt.detail.ctx && evt.detail.ctx.request) {
                        const req = evt.detail.ctx.request;
                        if (req.method && req.method.toUpperCase() !== 'GET') {
                            req.headers['X-CSRF-Token'] = token;
                        }
                    }
                }
            };
            document.body.addEventListener('htmx:configRequest', handleConfigRequest);
            document.body.addEventListener('htmx:config:request', handleConfigRequest);

            // Alpine.js Tree Re-initialization on HTMX swap
            const initAlpineOnSwap = (e) => {
                const target = e.detail?.target || e.detail?.ctx?.target || e.target;
                if (window.Alpine && target && target instanceof Element) {
                    window.Alpine.initTree(target);
                }
                syncNavigationState();
            };
            document.body.addEventListener('htmx:afterSwap', initAlpineOnSwap);
            document.body.addEventListener('htmx:after:swap', initAlpineOnSwap);
            document.body.addEventListener('htmx:oobAfterSwap', initAlpineOnSwap);
            document.body.addEventListener('htmx:pushedIntoHistory', () => syncNavigationState());
            window.addEventListener('popstate', () => syncNavigationState());

            // Synchronize active navigation link styling and topnav station dropdown
            function syncNavigationState() {
                const path = window.location.pathname;

                // Sync sidebar links
                document.querySelectorAll('aside nav a').forEach((link) => {
                    const href = link.getAttribute('href');
                    if (!href) return;
                    const isActive = (href === path) || 
                                     (href !== '/' && (href.endsWith('/') ? path.startsWith(href) : path === href || path.startsWith(href + '/')));
                    if (isActive) {
                        link.classList.add('bg-secondary-container', 'text-on-secondary-container', 'font-semibold', 'shadow-inner');
                        link.classList.remove('text-on-surface-variant');
                    } else {
                        link.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'font-semibold', 'shadow-inner');
                        link.classList.add('text-on-surface-variant');
                    }
                });

                // Sync topnav station selector dropdown if present
                const stnSelect = document.querySelector('header select');
                if (stnSelect) {
                    if (path.startsWith('/maitri')) {
                        stnSelect.value = 'maitri';
                    } else if (path.startsWith('/bharati')) {
                        stnSelect.value = 'bharati';
                    } else if (path.startsWith('/hq')) {
                        stnSelect.value = 'polar-all';
                    }
                }

                // Close mobile navigation drawer if open
                const alpineRoot = document.querySelector('[x-data]');
                if (alpineRoot && alpineRoot._x_dataStack && alpineRoot._x_dataStack[0]) {
                    alpineRoot._x_dataStack[0].mobileNavOpen = false;
                }
            }
        });
    </script>
</body>
