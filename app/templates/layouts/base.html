<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title | default("Antarctic Digital Twin") }}{% endblock %}</title>
    <!-- Google Fonts: Inter (UI), Playfair Display (headings), Playfair (body), JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Playfair:ital,opsz,wght@0,5..1200,300;0,5..1200,400;0,5..1200,500;0,5..1200,600;0,5..1200,700;1,5..1200,300;1,5..1200,400;1,5..1200,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- DTFIAS Design Tokens -->
    <style>
        :root {
            /* Brand palette */
            --brand-deep-green: #1A312C;
            --brand-teal: #428475;
            --brand-mint: #C8E6D7;
            --brand-cream: #F5F2EB;
            --brand-cream-dark: #E8E3D9;
            /* Status colours — light bg context */
            --status-ok: #2E7D5B;
            --status-info: #2878A8;
            --status-warning: #D9822B;
            --status-critical: #C44536;
            --status-stale: #6B7280;
            --status-offline: #9B1C1C;
            /* Status bg tints */
            --status-ok-bg: #E8F4EE;
            --status-info-bg: #E8F2F8;
            --status-warning-bg: #FFF3E3;
            --status-critical-bg: #FBE9E7;
            --status-stale-bg: #F3F4F6;
            /* Status colours — dark bg context */
            --status-ok-dark: #4ABA83;
            --status-info-dark: #5BA3D4;
            --status-warning-dark: #F0A050;
            --status-critical-dark: #E06050;
            /* Typography */
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-heading: 'Playfair Display', Georgia, 'Times New Roman', serif;
            --font-body: 'Playfair', Georgia, 'Times New Roman', serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        body {
            font-family: var(--font-ui);
        }

        /* Subtle core animations for interactive elements */
        a,
        button,
        input,
        select,
        textarea,
        .card,
        .hotspot {
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out, background-color 0.25s ease-in-out, border-color 0.25s ease-in-out;
        }

        /* Glassmorphism utilities */
        .glass-card {
            background: rgba(13, 31, 27, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(145, 211, 194, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            background: rgba(13, 31, 27, 0.8);
            border-color: rgba(145, 211, 194, 0.3);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5), 0 0 15px rgba(145, 211, 194, 0.1);
        }

        .glass-button {
            background: rgba(145, 211, 194, 0.08);
            border: 1px solid rgba(145, 211, 194, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .glass-button:hover {
            background: rgba(145, 211, 194, 0.2);
            border-color: rgba(145, 211, 194, 0.4);
        }

        .glass-button:active {
            transform: scale(0.97);
        }

        /* Animation keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
    <!-- In a real app, serve these from /static/vendor/ -->
    <script src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="{{ url_for('static', path='css/app.css') }}" rel="stylesheet">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

                    fontFamily: {

    {% block head %}{% endblock %}
</head>

<body class="antialiased" style="background-color: var(--brand-cream); color: #1A312C; font-family: var(--font-ui);"
    hx-boost="true">
    {% block body %}
        {% block content %}{% endblock %}
    {% endblock %}

    {% block scripts %}{% endblock %}
</body>
