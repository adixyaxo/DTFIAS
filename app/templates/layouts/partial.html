{# app/templates/layouts/partial.html #}
<main id="main-content" class="w-full">
    <div id="dashboard_content" class="flex flex-col w-full space-y-space-md select-none pb-space-xl mt-space-md">
        {% block dashboard_content %}{% endblock %}
    </div>
    {% if station_id %}
    <div id="portal-sidebar-wrapper" hx-swap-oob="true">
        {% include "components/sidebar_" ~ station_id ~ ".html" %}
    </div>
    {% endif %}
</main>
{% block scripts %}{% endblock %}
